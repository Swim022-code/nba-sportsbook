[project]
name = "nba-mock-sportsbook"
version = "1.0.0"
description = "Streamlit mock sportsbook for NBA games with EDA and LLM analysis"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Page files contain long markdown/table strings shown to users.
"views/*" = ["E501"]
"tests/*" = ["E501"]
"src/style.py" = ["E501"]   # HTML/CSS template strings
